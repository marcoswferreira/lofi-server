basePath: /api
definitions:
  models.CreateStationRequest:
    properties:
      description:
        type: string
      name:
        type: string
      playlist:
        items:
          $ref: '#/definitions/models.Track'
        type: array
    type: object
  models.PlaylistShare:
    properties:
      id:
        type: integer
      stationId:
        type: string
      stationName:
        type: string
      status:
        description: pending, accepted, rejected
        type: string
      userId:
        type: integer
    type: object
  models.SharePlaylistRequest:
    properties:
      userEmail:
        type: string
    type: object
  models.Station:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      ownerId:
        description: nil means global/system station
        type: integer
      playlist:
        items:
          $ref: '#/definitions/models.Track'
        type: array
    type: object
  models.Track:
    properties:
      duration:
        type: integer
      id:
        description: YouTube Video ID
        type: string
      title:
        type: string
    type: object
  models.UpdateShareRequest:
    properties:
      status:
        description: accepted, rejected
        type: string
    type: object
host: localhost:8081
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a lofi music streaming server with community features.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Lofi Server API
  version: "1.0"
paths:
  /auth/invitations:
    get:
      description: List all pending playlist sharing invitations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.PlaylistShare'
            type: array
      summary: Get pending invitations
      tags:
      - auth
  /auth/invitations/{id}:
    put:
      consumes:
      - application/json
      description: Accept or reject a playlist sharing invitation
      parameters:
      - description: Share ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'Status: accepted or rejected'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateShareRequest'
      responses:
        "200":
          description: Status updated
          schema:
            type: string
      summary: Update invitation status
      tags:
      - auth
  /stations:
    get:
      description: List all lofi music stations (global and user's private/shared
        ones)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Station'
            type: array
      summary: Get all stations
      tags:
      - stations
    post:
      consumes:
      - application/json
      description: Add a new lofi music station with a playlist. If authenticated,
        it will be private.
      parameters:
      - description: Station details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateStationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Station'
        "400":
          description: Invalid request body
          schema:
            type: string
      summary: Create a new station
      tags:
      - stations
  /stations/{id}:
    delete:
      description: Remove a station from the list. Requires ownership.
      parameters:
      - description: Station ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Station not found
          schema:
            type: string
      summary: Delete a station
      tags:
      - stations
    put:
      consumes:
      - application/json
      description: Update the details and playlist of an existing station. Requires
        ownership.
      parameters:
      - description: Station ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated station details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateStationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Station'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Station not found
          schema:
            type: string
      summary: Update a station
      tags:
      - stations
  /stations/{id}/share:
    post:
      consumes:
      - application/json
      description: Invite another user to access your private playlist
      parameters:
      - description: Station ID
        in: path
        name: id
        required: true
        type: string
      - description: User email to share with
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SharePlaylistRequest'
      responses:
        "200":
          description: Invitation sent
          schema:
            type: string
      summary: Share playlist
      tags:
      - stations
swagger: "2.0"
